name: Gerar APKs Ponto Pro Gestao

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Compilar ${{ matrix.variant }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: quiosque
            config: capacitor.config.ts
            apk: PontoPro-Quiosque.apk
          - variant: gestor
            config: capacitor.gestor.config.ts
            apk: PontoPro-Gestor.apk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Preparar projeto Android
        env:
          CAPACITOR_CONFIG: ${{ matrix.config }}
        run: |
          npm install
          npm run build || true
          if [ "$CAPACITOR_CONFIG" != "capacitor.config.ts" ]; then cp "$CAPACITOR_CONFIG" capacitor.config.ts; fi
          npx cap add android || true
          mkdir -p android/app/src/main/assets
          npx cap sync android

      - name: Trocar icone manualmente
        run: |
          python3 -c "
          from PIL import Image
          import os
          src = 'icon.png'
          if not os.path.exists(src):
              src = 'assets/icon.png'
          if not os.path.exists(src):
              src = 'public/pwa-icon-512.png'
          img = Image.open(src).convert('RGB')
          sizes = {'mipmap-mdpi': 48, 'mipmap-hdpi': 72, 'mipmap-xhdpi': 96, 'mipmap-xxhdpi': 144, 'mipmap-xxxhdpi': 192}
          for folder, size in sizes.items():
              path = f'android/app/src/main/res/{folder}'
              os.makedirs(path, exist_ok=True)
              img.resize((size, size), Image.LANCZOS).save(f'{path}/ic_launcher.png')
              img.resize((size, size), Image.LANCZOS).save(f'{path}/ic_launcher_round.png')
          print('Icone trocado com sucesso')
          "

      - name: Gerar APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Renomear APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk ${{ matrix.apk }}

      - name: Enviar APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.apk }}
          path: ${{ matrix.apk }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: apks
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Última versão
          files: apks/**/*.apk

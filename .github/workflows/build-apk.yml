name: Gerar APKs Ponto Pro Gestao

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Compilar ${{ matrix.variant }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: quiosque
            config: capacitor.config.ts
            apk: PontoPro-Quiosque.apk
          - variant: gestor
            config: capacitor.gestor.config.ts
            apk: PontoPro-Gestor.apk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Preparar projeto Android
        env:
          CAPACITOR_CONFIG: ${{ matrix.config }}
        run: |
          npm install
          mkdir -p assets
          cp public/pwa-icon-512.png assets/icon.png
          if [ "$CAPACITOR_CONFIG" != "capacitor.config.ts" ]; then cp "$CAPACITOR_CONFIG" capacitor.config.ts; fi
          npx cap add android
          npx cap sync android

      - name: Gerar APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Renomear APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk ${{ matrix.apk }}

      - name: Enviar APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.apk }}
          path: ${{ matrix.apk }}

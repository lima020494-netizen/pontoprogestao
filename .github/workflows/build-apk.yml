name: Gerar APKs Ponto Pro Gestao

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Compilar ${{ matrix.variant }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: quiosque
            config: capacitor.config.ts
            apk: PontoPro-Quiosque.apk
            icon: public/icon-quiosque.png
          - variant: gestor
            config: capacitor.gestor.config.ts
            apk: PontoPro-Gestor.apk
            icon: public/icon-gestor.png
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Preparar projeto Android
        env:
          CAPACITOR_CONFIG: ${{ matrix.config }}
        run: |
          npm install
          npm run build
          if [ "$CAPACITOR_CONFIG" != "capacitor.config.ts" ]; then cp "$CAPACITOR_CONFIG" capacitor.config.ts; fi
          if [ ! -d android ]; then npx cap add android; fi
          mkdir -p android/app/src/main/assets
          npx cap sync android

      - name: Habilitar impressao RawBT somente no Quiosque
        if: matrix.variant == 'quiosque'
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('android/app/src/main/AndroidManifest.xml')
          source = path.read_text()
          if 'ru.a402d.rawbtprinter' not in source:
              source = source.replace('<application', '  <queries>\n    <package android:name="ru.a402d.rawbtprinter" />\n  </queries>\n\n  <application', 1)
              path.write_text(source)
          PY

      - name: Aplicar icone da variante nos mipmaps Android
        env:
          ICON_FILE: ${{ matrix.icon }}
        run: |
          pip install pillow
          python3 - <<'PY'
          from PIL import Image
          import os
          img = Image.open(os.environ['ICON_FILE']).convert('RGB')
          sizes = {'mipmap-mdpi': 48, 'mipmap-hdpi': 72, 'mipmap-xhdpi': 96, 'mipmap-xxhdpi': 144, 'mipmap-xxxhdpi': 192}
          for folder, size in sizes.items():
              path = f'android/app/src/main/res/{folder}'
              os.makedirs(path, exist_ok=True)
              resized = img.resize((size, size), Image.Resampling.LANCZOS)
              resized.save(f'{path}/ic_launcher.png')
              resized.save(f'{path}/ic_launcher_round.png')
              resized.save(f'{path}/ic_launcher_foreground.png')
          print(f'Icone {os.environ["ICON_FILE"]} aplicado aos cinco mipmaps')
          PY

      - name: Gerar APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Renomear APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk ${{ matrix.apk }}

      - name: Enviar APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.apk }}
          path: ${{ matrix.apk }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: apks
      - name: Preparar downloads oficiais
        run: |
          mkdir -p release
          cp apks/PontoPro-Quiosque.apk/PontoPro-Quiosque.apk release/PontoPro-Quiosque.apk
          cp apks/PontoPro-Gestor.apk/PontoPro-Gestor.apk release/PontoPro-Gestor.apk
          cp release/PontoPro-Quiosque.apk release/Ponto-pro-gestao.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Última versão
          files: |
            release/PontoPro-Quiosque.apk
            release/PontoPro-Gestor.apk
            release/Ponto-pro-gestao.apk

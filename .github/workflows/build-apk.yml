name: Gerar APKs Ponto Pro Gestao

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Compilar ${{ matrix.variant }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: quiosque
            config: capacitor.config.ts
            apk: PontoPro-Quiosque.apk
          - variant: gestor
            config: capacitor.gestor.config.ts
            apk: PontoPro-Gestor.apk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Preparar projeto Android
        env:
          CAPACITOR_CONFIG: ${{ matrix.config }}
        run: |
          npm install
          mkdir -p assets
          cp public/pwa-icon-512.png assets/icon.png
          cp "$CAPACITOR_CONFIG" capacitor.config.ts
          npx cap add android
          npx --yes @capacitor/assets generate --android --iconBackgroundColor "#ffffff"
          npm run build
          npx cap copy android

      - name: Habilitar impressao RawBT somente no Quiosque
        if: matrix.variant == 'quiosque'
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('android/app/src/main/AndroidManifest.xml')
          source = path.read_text()
          if '<queries>' not in source:
              queries = '''    <queries>
                  <package android:name="ru.a402d.rawbtprinter" />
                  <intent>
                      <action android:name="android.intent.action.VIEW" />
                      <data android:scheme="rawbt" />
                  </intent>
              </queries>
          </manifest>'''
              path.write_text(source.replace('</manifest>', queries))
          PY

          MAIN_ACTIVITY="android/app/src/main/java/com/pontoprogestao/app/MainActivity.java"
          cat <<'EOF' > "$MAIN_ACTIVITY"
          package com.pontoprogestao.app;

          import android.content.Intent;
          import android.os.Bundle;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebView;
          import com.getcapacitor.BridgeActivity;
          import com.getcapacitor.BridgeWebViewClient;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  bridge.getWebView().setWebViewClient(new BridgeWebViewClient(bridge) {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          return openPrinterIntent(view, request.getUrl().toString())
                              || super.shouldOverrideUrlLoading(view, request);
                      }

                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, String url) {
                          return openPrinterIntent(view, url)
                              || super.shouldOverrideUrlLoading(view, url);
                      }

                      private boolean openPrinterIntent(WebView view, String url) {
                          if (!url.startsWith("intent:") && !url.startsWith("rawbt:")) return false;
                          try {
                              Intent intent = Intent.parseUri(url, Intent.URI_INTENT_SCHEME);
                              view.getContext().startActivity(intent);
                          } catch (Exception error) {
                              error.printStackTrace();
                          }
                          return true;
                      }
                  });
              }
          }
          EOF

      - name: Compilar APK de teste
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Nomear pacote
        env:
          APK_NAME: ${{ matrix.apk }}
        run: |
          mkdir -p "$RUNNER_TEMP/apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/apk/$APK_NAME"

      - uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.variant }}
          path: ${{ runner.temp }}/apk/${{ matrix.apk }}
          if-no-files-found: error

  release:
    name: Reunir downloads Android
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: apk-*
          path: release
          merge-multiple: true

      - name: Preservar endereco oficial legado do Quiosque
        run: cp release/PontoPro-Quiosque.apk release/Ponto-pro-gestao.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: android-${{ github.run_number }}-${{ github.run_attempt }}
          name: Android ${{ github.run_number }}.${{ github.run_attempt }}
          generate_release_notes: true
          make_latest: true
          files: |
            release/PontoPro-Quiosque.apk
            release/PontoPro-Gestor.apk
            release/Ponto-pro-gestao.apk
